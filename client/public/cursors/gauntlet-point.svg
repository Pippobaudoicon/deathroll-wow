<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="32" height="32" viewBox="0 0 32 32">
  <!-- Armored gauntlet pointing up-left; drawn upright with the fingertip at the origin, then rotated. Hotspot (3,2). Highlighted variant for clickable elements. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.45" stop-color="#ffd100"/>
      <stop offset="1" stop-color="#a8801c"/>
    </linearGradient>
    <linearGradient id="cuff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#8a5f16"/>
    </linearGradient>
    <path id="cuff-shape" d="M-5 23 L10.5 23 L10.5 31 L-6 31 Z"/>
    <path id="hand-shape" d="M-3 11 L3 10.5 L7.5 11.5 L10.5 14 L11 19 L10 23 L-4 23 L-3.5 20 Z"/>
    <path id="thumb-shape" d="M-3 13.5 L-6.5 15 L-8.5 18.5 L-7 20.5 L-3.5 20 Z"/>
    <path id="finger-shape" d="M-2.4 11 L-2.4 2.6 Q-2.4 0 0 0 Q2.4 0 2.4 2.6 L2.6 11 Z"/>
  </defs>
  <g transform="translate(3 2) rotate(-40)" fill="none" stroke="#fff1a8" stroke-width="3" stroke-linejoin="round" opacity="0.6"><use xlink:href="#cuff-shape"/><use xlink:href="#hand-shape"/><use xlink:href="#thumb-shape"/><use xlink:href="#finger-shape"/></g>
  <g transform="translate(3 2) rotate(-40)" stroke="#1b1006" stroke-width="1.3" stroke-linejoin="round">
    <use xlink:href="#cuff-shape" fill="url(#cuff)"/>
    <use xlink:href="#hand-shape" fill="url(#metal)"/>
    <use xlink:href="#thumb-shape" fill="url(#metal)"/>
    <use xlink:href="#finger-shape" fill="url(#metal)"/>
    <g fill="none" stroke="#4a2e0c" stroke-width="0.8">
      <path d="M-5.2 25.5 H10.5"/>
      <path d="M3 12.8 Q6.5 12.3 10 14.8 M3.4 15.8 Q7 15.4 10.6 17.8 M3.4 18.8 Q7 18.8 10.4 20.8"/>
      <path d="M-2.4 4.2 H2.4 M-2.5 7.6 H2.5"/>
    </g>
    <path d="M-1.5 2.4 V10" fill="none" stroke="#fff1a8" stroke-width="0.7" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
